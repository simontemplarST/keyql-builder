[package]
name = "keyql-builder"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
eframe = { version = "0.37.0", features = ["persistence"] }
egui_extras = { version = "0.37.0", features = ["datepicker", "serde"] }
jiff = { version = "0.2.38", default-features = false }
open = "5.4.5"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
