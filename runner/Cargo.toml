[package]
name = "keyql-runner"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "eDiscovery Search Runner: opens .req request files, signs an admin in to Microsoft 365 and runs the search in Microsoft Purview, with a tamper-evident audit log."

[[bin]]
name = "keyql-runner"
path = "src/main.rs"

[dependencies]
base64 = "0.23.1"
chrono = "0.4.45"
eframe = { version = "0.37", features = ["persistence"] }
getrandom = "0.4.3"
keyql-builder = { path = ".." }
open = "5.4.5"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
ureq = { version = "3", features = ["json"] }
